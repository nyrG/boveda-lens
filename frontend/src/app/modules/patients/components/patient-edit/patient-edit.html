<div>
  @if (record(); as patient) {
    <form [formGroup]="patientForm" (ngSubmit)="saveChanges()" class="space-y-6 pb-12">
      <!-- Page Header -->
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-bold text-slate-800">Editing: {{ patient.record.name }}</h2>
        <!-- Action Buttons -->
        <div class="flex gap-2">
          <button
            type="button"
            (click)="cancel()"
            class="inline-flex items-center gap-2 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-semibold text-slate-700 transition-colors hover:bg-slate-50"
          >
            <i class="fa-solid fa-xmark"></i>
            <span>Cancel</span>
          </button>
          <button
            type="submit"
            class="inline-flex items-center gap-2 rounded-md border border-transparent bg-primary px-3 py-1.5 text-sm font-semibold text-white transition-colors hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2"
          >
            <i class="fa-solid fa-check"></i>
            <span>Save Changes</span>
          </button>
        </div>
      </div>

      <!-- Tab Navigation -->
      <div class="border-b border-slate-200">
        <nav class="flex gap-4 -mb-px">
          @for (tab of tabs; track tab.id) {
            <button
              type="button"
              (click)="setActiveTab(tab.id)"
              [ngClass]="{
                'border-primary text-primary': activeTab() === tab.id,
                'border-transparent text-slate-500 hover:border-slate-300 hover:text-slate-700':
                  activeTab() !== tab.id,
              }"
              class="border-b-2 py-3 px-2 font-medium transition-colors"
            >
              {{ tab.label }}
            </button>
          }
        </nav>
      </div>

      <!-- Tab Content Panel -->
      <div class="mt-6">
        @switch (activeTab()) {
          @case ('info') {
            <app-patient-info-form
              (addAddress)="addAddress()"
              (removeAddress)="removeAddress($event)"
              class="tab-content-enter"
            />
          }
          @case ('summary') {
            <div formGroupName="summary" class="tab-content-enter">
              <app-patient-summary-form />
            </div>
          }
          @case ('consultations') {
            <app-patient-consultations-form
              [consultations]="patientForm.controls.consultations"
              (add)="addConsultation()"
              (remove)="removeConsultation($event)"
            />
          }
          @case ('labs') {
            <app-patient-labs-form
              [labResults]="patientForm.controls.lab_reports"
              (addReport)="addLabResult()"
              (removeReport)="removeLabResult($event)"
              (addTestRow)="addTestRow($event)"
              (removeTestRow)="removeTestRow($event)"
            />
          }
          @case ('radiology') {
            <app-patient-radiology-form
              [radiologyReports]="patientForm.controls.radiology_reports"
              (addReport)="addRadiologyReport()"
              (removeReport)="removeRadiologyReport($event)"
            />
          }
          @case ('sponsor') {
            <div class="tab-content-enter" formGroupName="sponsor">
              <app-patient-sponsor-form
                [showForm]="showSponsorForm()"
                (register)="registerSponsor()"
              />
            </div>
          }
        }
      </div>
    </form>
  } @else {
    <!-- Skeleton Loader -->
    <div class="animate-pulse space-y-6">
      <!-- Page Header Skeleton -->
      <div class="flex items-center justify-between">
        <div class="h-7 w-64 rounded-md bg-slate-200"></div>
        <div class="flex gap-2">
          <div class="h-9 w-24 rounded-md bg-slate-200"></div>
          <div class="h-9 w-32 rounded-md bg-slate-200"></div>
        </div>
      </div>
      <!-- Form Card Skeleton -->
      <div class="h-96 rounded-lg border border-slate-200 bg-slate-200"></div>
    </div>
  }
</div>
