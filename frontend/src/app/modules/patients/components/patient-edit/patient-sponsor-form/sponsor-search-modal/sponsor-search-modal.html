<!-- Transparent backdrop to catch "click away" events -->
<div class="fixed inset-0 z-40" (click)="handleClose()"></div>

<!-- Popover Panel -->
<div
  class="relative z-50 mt-2 w-96 origin-top-right transform rounded-lg bg-white text-left shadow-xl ring-1 ring-black ring-opacity-5"
  [ngClass]="{
    'animate-popover-enter': !isClosing(),
    'animate-popover-leave': isClosing(),
  }"
>
  <!-- The (click)="$event.stopPropagation()" is no longer needed on a nested div -->
  <div>
    <!-- Modal Body -->
    <div class="p-4">
      <input
        type="text"
        class="form-input w-full"
        placeholder="Type to search sponsor..."
        [ngModel]="searchTerm()"
        (ngModelChange)="onSearchTermChange($event)"
        autofocus
      />

      <!-- Search Results -->
      <div class="mt-3 h-64 overflow-y-auto overflow-x-hidden rounded-md border border-slate-200">
        <ul class="divide-y divide-slate-200">
          @for (sponsor of searchResults; track sponsor.id) {
            <li
              (mousedown)="selectSponsor(sponsor)"
              class="cursor-pointer p-3 text-slate-700 hover:bg-slate-100 animate-fly-in-right"
            >
              <div class="font-medium">{{ sponsor.first_name }} {{ sponsor.last_name }}</div>
              <div class="text-sm text-slate-500">AFPSN: {{ sponsor.afpsn || 'N/A' }}</div>
            </li>
          } @empty {
            <li class="p-6 text-center text-slate-500">
              @if (isSearching) {
                Searching...
              } @else {
                No results found. Enter a name to search.
              }
            </li>
          }
        </ul>
      </div>
    </div>
  </div>
</div>
