<div class="tab-content-enter">
  <div class="space-y-6" formArrayName="lab_reports">
    <!-- Header with Add Button -->
    <div class="flex items-center justify-between">
      <h3 class="text-lg font-semibold text-slate-800">Laboratory Results</h3>
      <button
        type="button"
        (click)="addReport.emit()"
        class="inline-flex items-center gap-2 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-semibold text-slate-700 transition-colors hover:bg-slate-50"
      >
        <i class="fa-solid fa-plus"></i>
        <span>Add Lab Report</span>
      </button>
    </div>

    @for (labGroup of labResults.controls; track $index) {
      <div class="rounded-lg border border-slate-200 bg-white shadow-sm" [formGroupName]="$index">
        <!-- Card Header -->
        <div class="flex items-center justify-between border-b border-slate-200 bg-slate-50 p-4">
          <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-calendar-alt text-slate-400"></i>
              <label for="lab-date-{{ $index }}" class="form-label !m-0">Date Performed</label>
              <input
                type="date"
                id="lab-date-{{ $index }}"
                class="form-input !mt-0 w-40"
                formControlName="date_performed"
              />
            </div>
          </div>
          <button
            type="button"
            (click)="removeReport.emit($index)"
            class="text-slate-400 hover:text-red-500"
            title="Remove this lab report"
          >
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>

        <!-- Card Body with Results Table -->
        <div class="p-6">
          <div class="mb-6">
            <label for="test-type-{{ $index }}" class="form-label">Test Type / Report Name</label>
            <input
              type="text"
              id="test-type-{{ $index }}"
              class="form-input"
              formControlName="test_type"
              placeholder="e.g., Complete Blood Count"
            />
          </div>

          <div formArrayName="results">
            <div class="overflow-x-auto">
              <table class="min-w-full text-sm">
                <thead class="bg-slate-50">
                  <tr>
                    <th class="px-3 py-2 text-left font-medium text-slate-600">Test</th>
                    <th class="px-3 py-2 text-left font-medium text-slate-600">Result</th>
                    <th class="px-3 py-2 text-left font-medium text-slate-600">Unit</th>
                    <th class="px-3 py-2 text-left font-medium text-slate-600">Reference Range</th>
                    <th class="w-12 px-3 py-2 text-right font-medium text-slate-600"></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                  @for (
                    testRow of getTestRows($index).controls;
                    let rowIndex = $index;
                    track rowIndex
                  ) {
                    <tr [formGroupName]="rowIndex">
                      <td class="p-1">
                        <input type="text" class="form-input !mt-0" formControlName="test_name" />
                      </td>
                      <td class="p-1">
                        <input type="text" class="form-input !mt-0" formControlName="value" />
                      </td>
                      <td class="p-1">
                        <input type="text" class="form-input !mt-0" formControlName="unit" />
                      </td>
                      <td class="p-1">
                        <input
                          type="text"
                          class="form-input !mt-0"
                          formControlName="reference_range"
                        />
                      </td>
                      <td class="p-1 text-right">
                        <button
                          type="button"
                          (click)="removeTestRow.emit({ labIndex: $index, rowIndex: rowIndex })"
                          class="text-slate-400 hover:text-red-500 h-9 w-9"
                          title="Remove test row"
                        >
                          <i class="fa-solid fa-xmark"></i>
                        </button>
                      </td>
                    </tr>
                  }
                </tbody>
              </table>
            </div>
            <button
              type="button"
              (click)="addTestRow.emit($index)"
              class="mt-4 inline-flex items-center gap-2 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-semibold text-slate-700 transition-colors hover:bg-slate-50"
            >
              <i class="fa-solid fa-plus"></i>
              <span>Add Test Row</span>
            </button>
          </div>
        </div>
      </div>
    } @empty {
      <div class="text-center py-12 text-slate-400 rounded-lg border-2 border-dashed">
        <i class="fa-solid fa-flask-vial fa-3x mb-3"></i>
        <p class="font-medium">No Lab Reports</p>
        <p class="text-sm">Click "Add Lab Report" to create the first one.</p>
      </div>
    }
  </div>
</div>
